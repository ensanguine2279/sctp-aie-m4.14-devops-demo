name: osv-scanner

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 1 * * 1"   # every Monday 01:30 UTC (09:30 Singapore)
  workflow_dispatch:       # adds a "Run workflow" button

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Generate SBOM & Scan Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Adjust to your Java version (17, 21, etc.)
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate CycloneDX SBOM
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Run OSV-Scanner Action
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0 # v2.7.0
        with:
          scan-args: |
            --sbom=target/bom.json