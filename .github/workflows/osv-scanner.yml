name: OSV Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write

jobs:
  scan-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download OSV-Scanner CLI
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/google/osv-scanner/releases/latest | grep "browser_download_url" | grep "linux_amd64" | cut -d '"' -f 4 | head -n 1)
          
          if [[ "$DOWNLOAD_URL" == *.tar.gz ]] || [[ "$DOWNLOAD_URL" == *.tgz ]]; then
            curl -sSfL "$DOWNLOAD_URL" | tar -xz -C ~/.local/bin osv-scanner
          else
            curl -sSfL "$DOWNLOAD_URL" -o ~/.local/bin/osv-scanner
          fi
          
          chmod +x ~/.local/bin/osv-scanner
          osv-scanner --version

      - name: Generate CycloneDX SBOM
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Verify and Generate SARIF Report
        run: |
          if [ ! -f target/bom.json ]; then
            echo "Error: target/bom.json was not generated!"
            exit 1
          fi
          
          osv-scanner --sbom=target/bom.json --format=sarif --output=results.sarif || true
          ls -la results.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: osv-scanner