name: OSV Dependency Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Step 1: Build the SBOM and store it as an artifact
  build-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate CycloneDX SBOM
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: target
          path: target/bom.json

  # Step 2: Pass the artifact to Google's Reusable Workflow
  osv-scan:
    needs: build-sbom
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      # download-artifact: target
      # upload-sarif: false  # Valid here because this is a reusable workflow input!
      scan-args: |
        --sbom=target/bom.json